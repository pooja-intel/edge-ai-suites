apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: weld-data-simulator
  name: deployment-weld-data-simulator
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: weld-data-simulator
  template:
    metadata:
      labels:
        app: weld-data-simulator
    spec:
      {{- if and .Values.DOCKER_USERNAME .Values.DOCKER_PASSWORD }}
      imagePullSecrets:
      - name: registryauth
      {{- end }}
      containers:
      - name: weld-data-simulator
        image: {{ .Values.DOCKER_REGISTRY }}{{ .Values.images.weld_data_simulator_image }}{{ if .Values.images.image_suffix }}-{{ .Values.images.image_suffix }}{{ end }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        securityContext:
          runAsUser: {{ .Values.env.TIMESERIES_UID }}
          runAsGroup: {{ .Values.env.TIMESERIES_UID }}
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: MQTT_BROKER
          value: "{{ .Values.config.mqttbroker.name }}"
        - name: MEDIAMTX_SERVER
          value: "{{ .Values.config.mediamtx.name }}"
        - name: MEDIAMTX_PORT
          value: "{{ .Values.config.mediamtx.int.rtsp_output_port }}"
        - name: TS_TOPIC
          value: "{{ .Values.env.TS_TOPIC }}"
        - name: RTSP_STREAM_NAME
          value: "live.stream"
        - name: no_proxy
          value: "{{ .Values.config.mqttbroker.name }},{{ .Values.config.time_series_analytics_microservice.name }},{{ .Values.config.mediamtx.name }},{{ .Values.env.timeseries_no_proxy }}"
        - name: NO_PROXY
          value: "{{ .Values.config.mqttbroker.name }},{{ .Values.config.time_series_analytics_microservice.name }},{{ .Values.config.mediamtx.name }},{{ .Values.env.timeseries_no_proxy }}"
        - name: TS_MS_SERVER
          value: "{{ .Values.config.time_series_analytics_microservice.name }}"
        - name: TS_MS_PORT
          value: "{{ .Values.config.time_series_analytics_microservice.kapacitor_port }}"
        - name: CONTINUOUS_SIMULATOR_INGESTION
          value: "{{ .Values.env.CONTINUOUS_SIMULATOR_INGESTION }}"
        - name: SIMULATION_TARGET_FPS
          value: "{{ .Values.env.SIMULATION_TARGET_FPS }}"
        - name: LOG_LEVEL
          value: "{{ .Values.env.LOG_LEVEL }}"
        - name: HTTP_PROXY
          value: "{{ .Values.env.HTTP_PROXY }}"
        - name: HTTPS_PROXY
          value: "{{ .Values.env.HTTPS_PROXY }}"
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir: {}
      restartPolicy: Always

